<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main>
        <header>
            <nav>
                <h1>Recipe Book</h1>
            </nav>
        </header>
        <section id="filter-option">
            <div class="filter-method">
                <h2>Filter By :</h2>
                <label>Cuisine</label>
                <select id="cuisine">
                </select>
                <label>Diet</label>
                <select id="diet">
                </select>
                <label>Meal Type</label>
                <select id="meal-type">
                </select>
            </div>
            <div class="action-btn">
                <button class="btn">Apply Filter</button>
                <button class="reset-btn">Reset</button>
            </div>

        </section>
        <section class="recipe-card-container">
            <ul class="recipe-card" id="recipe-card-el">
            </ul>
        </section>
    </main>
    <script src="./script.js"></script>
</body>

</html>
